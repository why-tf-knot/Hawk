[project]
name = "hawk-backend"
version = "0.1.0"
description = "Industrial aerosol and emissions monitoring API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
